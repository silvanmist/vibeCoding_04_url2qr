<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Studio - 간편하고 빠른 QR코드 생성 및 다운로드</title>
  <meta name="description" content="URL을 입력하여 즉시 고화질 QR코드를 생성하고 클릭 한 번으로 JPG 파일로 다운로드하세요.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 동적 인터랙티브 배경 & 그라데이션 -->
  <div class="interactive-bg" id="interactiveBg"></div>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <!-- 상단 네비게이션 헤더 -->
  <header class="app-header" id="appHeader">
    <div class="logo-container" id="logoContainer">
      <img src="img/logo.png" alt="서비스 로고" class="logo-img" id="logoImg" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
      <div class="logo-fallback" id="logoFallback" style="display: none;">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">QR Studio</span>
      </div>
    </div>
    <div class="header-badge">
      <span class="pulse-dot"></span>
      <span>Instant QR Generator</span>
    </div>
  </header>

  <!-- 메인 뷰포트 영역 -->
  <main class="main-canvas" id="mainCanvas">

    <!-- 중앙 QR 코드 디스플레이 영역 (초기 숨김, 확인 시 정중앙 등장) -->
    <section class="qr-display-section" id="qrDisplaySection" aria-live="polite">
      <div class="qr-card" id="qrCard">
        <div class="qr-card-header">
          <span class="qr-card-tag">Ready to Download</span>
          <span class="qr-format-badge">JPG 300 DPI</span>
        </div>

        <!-- 클릭 가능한 QR 코드 컨테이너 -->
        <div class="qr-interactive-wrapper" id="qrInteractiveWrapper" role="button" tabindex="0" title="클릭하여 JPG 파일로 다운로드">
          <div class="qr-code-box" id="qrcodeBox">
            <!-- qrcodejs가 캔버스/이미지를 동적으로 렌더링 -->
          </div>
          <div class="qr-overlay" id="qrOverlay">
            <div class="overlay-content">
              <svg class="download-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span class="overlay-text">클릭하여 JPG 다운로드</span>
            </div>
          </div>
        </div>

        <!-- 하단 정보 및 액션 버튼들 -->
        <div class="qr-info-bar">
          <div class="url-preview-wrapper" title="생성된 URL">
            <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span class="target-url-text" id="targetUrlText">https://example.com</span>
          </div>
          <div class="qr-action-buttons">
            <button type="button" class="btn-icon" id="btnCopyUrl" title="URL 주소 복사">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <button type="button" class="btn-download-primary" id="btnDirectDownload">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>JPG 다운로드</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 인터랙티브 URL 입력 컨테이너 (초기 중앙 -> 확인 후 하단 슬라이드 다운) -->
    <div class="input-stage" id="inputStage">
      <div class="input-card" id="inputCard">
        <div class="input-hero-text" id="inputHeroText">
          <h1 class="main-title">간편하고 빠른 QR 코드 생성</h1>
          <p class="subtitle">변환할 웹사이트 URL 또는 텍스트를 입력하세요</p>
        </div>

        <form class="url-form" id="urlForm" onsubmit="return false;">
          <div class="input-field-wrapper" id="inputFieldWrapper">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </div>
            <input 
              type="text" 
              id="urlInput" 
              class="url-input" 
              placeholder="URL을 입력하세요 (예: https://google.com)" 
              autocomplete="off" 
              spellcheck="false"
              required
            >
            <button type="button" class="btn-clear" id="btnClearInput" title="입력 내용 지우기">✕</button>
          </div>

          <button type="submit" class="btn-submit" id="btnSubmit">
            <span class="btn-text">확인</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <div class="input-footer-hint" id="inputFooterHint">
          <span class="hint-item">✨ 고해상도 생성</span>
          <span class="hint-dot">•</span>
          <span class="hint-item">⚡ 원클릭 JPG 저장</span>
          <span class="hint-dot">•</span>
          <span class="hint-item">🔒 안전한 로컬 변환</span>
        </div>
      </div>
    </div>

  </main>

  <!-- 토스트 알림 메시지 컴포넌트 -->
  <div class="toast-notification" id="toastNotification" role="alert">
    <div class="toast-icon" id="toastIcon">✓</div>
    <div class="toast-message" id="toastMessage">QR 코드가 다운로드되었습니다!</div>
  </div>

  <!-- QR 코드 생성 라이브러리 (로컬 qrcode.min.js) -->
  <script src="qrcode.min.js"></script>
  <!-- 메인 스크립트 -->
  <script src="app.js"></script>
</body>
</html>
